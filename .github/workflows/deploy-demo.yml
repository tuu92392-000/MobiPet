# Builds the browser-only demo (npm run build:demo) and publishes it to GitHub Pages:
# https://tuu92392-000.github.io/MobiPet/
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the browser-only demo
        run: npm run build:demo

      - name: Refuse to publish anything that looks like an API key or token
        run: |
          if grep -rEn 'sk-ant-[A-Za-z0-9_-]{8,}|ANTHROPIC_API_KEY|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY' dist-demo; then
            echo "::error::The demo build contains an API-key pattern. Nothing was deployed."
            exit 1
          fi
          echo "No API-key patterns in dist-demo."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
